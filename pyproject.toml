[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gambit"
version = "0.1.0"
description = "Research reproduction code for LLM-based cyber adversary analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Soham Hans" }]
dependencies = [
  "pandas==2.3.2",
  "pydantic==2.11.9",
  "python-dateutil==2.9.0.post0",
  "xmltodict==0.14.2",
]

[project.optional-dependencies]
openai = [
  "llama-index-core==0.14.2",
  "llama-index-embeddings-openai==0.5.1",
  "llama-index-llms-openai==0.5.6",
  "openai==1.109.0",
]
dev = [
  "pytest==8.3.4",
  "ruff==0.12.10",
]

# This target supports the editable research environment; no package release is
# produced or published by this repository.
[tool.hatch.build.targets.wheel]
packages = ["src/gambit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
